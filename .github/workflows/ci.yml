name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    name: Go lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          test -z "$(gofmt -l packages services workers)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build services
        run: go build ./services/...

      - name: Coverage
        run: go test -coverprofile=coverage.out ./packages/...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

  contracts:
    name: Contract validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate contracts
        run: make validate-contracts

  web:
    name: Next.js lint, test and build
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/web/package.json') != '' }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build
