<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="950" viewBox="0 0 1650 950" role="img" aria-labelledby="title desc">
  <title id="title">Pulse Seat reservation and checkout sequence</title>
  <desc id="desc">Draw.io style sequence diagram for event detail, reservation hold, payment, ticket issuance and conflict paths.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#334155"/></marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#64748b" stroke-width="1.6"/></marker>
    <style>
      .bg{fill:#fff}.label{font-family:Inter,Arial,sans-serif;fill:#1f2937}.title{font-size:26px;font-weight:700;fill:#1e40af}.head{stroke-width:2;rx:8}.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7}.msg{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.ret{stroke:#64748b;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#open)}.note{fill:#fff7ed;stroke:#d97706;stroke-width:2}.conflict{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.fan{fill:#dae8fc;stroke:#6c8ebf}.browse{fill:#fff2cc;stroke:#d6b656}.api{fill:#ffe6cc;stroke:#d79b00}.svc{fill:#d5e8d4;stroke:#82b366}.ext{fill:#f5f5f5;stroke:#666}
    </style>
  </defs>
  <rect class="bg" width="1650" height="950"/>
  <text class="label title" x="54" y="46">Pulse Seat - Reservation &amp; Checkout Sequence</text>
  <text class="label" x="54" y="75" font-size="16" fill="#64748b">Only Booking Service reserve/confirm transactions mutate availability; search and cache never decide ownership.</text>

  <g id="lifelines">
    <rect class="head fan" x="55" y="110" width="150" height="54" rx="8"/><text class="label" x="111" y="143" font-size="16" font-weight="700">Fan</text><line class="life" x1="130" y1="164" x2="130" y2="835"/>
    <rect class="head browse" x="270" y="110" width="170" height="54" rx="8"/><text class="label" x="300" y="137" font-size="15" font-weight="700">Search +</text><text class="label" x="287" y="156" font-size="15" font-weight="700">Booking Detail</text><line class="life" x1="355" y1="164" x2="355" y2="835"/>
    <rect class="head api" x="510" y="110" width="155" height="54" rx="8"/><text class="label" x="575" y="143" font-size="16" font-weight="700">API</text><line class="life" x1="588" y1="164" x2="588" y2="835"/>
    <rect class="head svc" x="735" y="110" width="205" height="54" rx="8"/><text class="label" x="775" y="143" font-size="16" font-weight="700">Booking Service</text><line class="life" x1="838" y1="164" x2="838" y2="835"/>
    <rect class="head svc" x="1010" y="110" width="165" height="54" rx="8"/><text class="label" x="1050" y="143" font-size="16" font-weight="700">PostgreSQL</text><line class="life" x1="1092" y1="164" x2="1092" y2="835"/>
    <rect class="head ext" x="1250" y="110" width="140" height="54" rx="8"/><text class="label" x="1303" y="143" font-size="16" font-weight="700">PSP</text><line class="life" x1="1320" y1="164" x2="1320" y2="835"/>
    <rect class="head fan" x="1450" y="110" width="160" height="54" rx="8"/><text class="label" x="1467" y="143" font-size="16" font-weight="700">Ticket + Notify</text><line class="life" x1="1530" y1="164" x2="1530" y2="835"/>
  </g>

  <path class="msg" d="M130 205H355"/><text class="label" x="150" y="194" font-size="15">1. View event detail + availability</text>
  <path class="ret" d="M355 265H130"/><text class="label" x="178" y="254" font-size="15" fill="#64748b">2. Return cached summary</text>
  <path class="msg" d="M130 325H588"/><text class="label" x="185" y="314" font-size="15">3. Reserve selected seats or GA quantity</text>
  <path class="msg" d="M588 385H838"/><text class="label" x="604" y="374" font-size="15">4. Validate sale window, limits, access code</text>
  <path class="msg" d="M838 445H1092"/><text class="label" x="864" y="434" font-size="15">5. SELECT inventory FOR UPDATE</text>
  <path class="ret" d="M1092 505H838"/><text class="label" x="886" y="494" font-size="15" fill="#64748b">6. HELD + held_until</text>
  <path class="ret" d="M588 565H130"/><text class="label" x="220" y="554" font-size="15" fill="#64748b">7. Return reservation countdown</text>
  <path class="msg" d="M130 625H588"/><text class="label" x="205" y="614" font-size="15">8. Checkout + pay</text>
  <path class="msg" d="M588 685H1320"/><text class="label" x="820" y="674" font-size="15">9. Charge payment with idempotency key</text>
  <path class="ret" d="M1320 745H588"/><text class="label" x="830" y="734" font-size="15" fill="#64748b">10. Webhook success</text>
  <path class="msg" d="M588 805H1530"/><text class="label" x="900" y="794" font-size="15">11. HELD -&gt; SOLD, issue QR tickets, send email</text>

  <rect class="conflict" x="730" y="850" width="610" height="58" rx="10"/>
  <text class="label" x="755" y="884" font-size="16">Conflict branch: if any seat is not AVAILABLE, return 409 and suggest alternatives.</text>
</svg>
